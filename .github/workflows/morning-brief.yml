name: morning-brief

on:
  schedule:
    - cron: "0 22 * * 1-5"   # UTC 22:00 = KST 07:00 (화~토)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "카드만 생성 (카카오 발송 생략)"
        type: boolean
        default: true
      sample:
        description: "가짜 데이터로 렌더링"
        type: boolean
        default: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: kakao_brief/requirements.txt
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: pip install -r kakao_brief/requirements.txt
      - name: Build and send
        working-directory: kakao_brief
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_LINK_URL: ${{ vars.KAKAO_LINK_URL }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
            [ "${{ inputs.sample }}" = "true" ] && ARGS="$ARGS --sample"
          fi
          python main.py $ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: cards
          path: kakao_brief/cards/*.png
          retention-days: 3
